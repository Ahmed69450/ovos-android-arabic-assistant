name: Build OVOS Arabic Assistant APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build APK with Gradle
      run: |
        echo "Building Android APK..."
        gradle assembleDebug --stacktrace

    - name: Verify Generated APK
      id: find_apk
      run: |
        APK_PATH=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
        if [ -z "$APK_PATH" ]; then
          echo "Error: No APK found!"
          exit 1
        fi
        echo "Found APK: $APK_PATH"
        cp "$APK_PATH" app-debug.apk
        sha256sum app-debug.apk > app-debug.apk.sha256
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OVOS-ArabicAssistant-APK
        path: |
          app-debug.apk
          app-debug.apk.sha256
        retention-days: 30

    - name: Publish GitHub Release (if tagged or main push)
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ github.ref_name }}
        name: "Release ${{ github.ref_name }}"
        body: |
          ### المساعد الصوتي العربي المحلي (OVOS Android Assistant)
          حزمة التطبيق الرسمية (APK) مبنية على معمارية OpenVoiceOS وتعمل محلياً بالكامل دون اتصال بالإنترنت (Offline).
          
          - **المحرك:** OpenVoiceOS (Adapted Core)
          - **التكامل:** Chaquopy CPython Runtime
          - **النموذج:** TF-IDF Arabic NLU Local Classifier
        files: |
          app-debug.apk
          app-debug.apk.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
