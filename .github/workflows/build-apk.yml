name: Build OVOS Arabic Assistant APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Download ONNX Semantic Model Asset
      run: |
        echo "Ensuring ONNX semantic model assets are present..."
        python download_and_setup_semantic_model.py

    - name: Build APK with Gradle
      run: |
        echo "Building Android APK..."
        gradle assembleDebug --stacktrace --no-daemon > gradle_build.log 2>&1 || {
          echo "=== GRADLE BUILD FAILED: LOG OUTPUT ==="
          tail -n 100 gradle_build.log
          exit 1
        }

    - name: Upload Build Log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-build-log
        path: gradle_build.log

    - name: Verify Generated APK
      id: find_apk
      run: |
        APK_PATH=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
        if [ -z "$APK_PATH" ]; then
          echo "Error: No APK found!"
          exit 1
        fi
        echo "Found APK: $APK_PATH"
        cp "$APK_PATH" app-debug.apk
        sha256sum app-debug.apk > app-debug.apk.sha256
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OVOS-ArabicAssistant-APK
        path: |
          app-debug.apk
          app-debug.apk.sha256
        retention-days: 30

    - name: Determine Release Tag
      id: release_info
      env:
        GITHUB_REF_VAL: ${{ github.ref }}
        GITHUB_REF_NAME_VAL: ${{ github.ref_name }}
      run: |
        if [[ "$GITHUB_REF_VAL" == refs/tags/* ]]; then
          echo "tag=$GITHUB_REF_NAME_VAL" >> "$GITHUB_OUTPUT"
        else
          echo "tag=v2.3.0" >> "$GITHUB_OUTPUT"
        fi

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_info.outputs.tag }}
        name: "OVOS Arabic Assistant ${{ steps.release_info.outputs.tag }}"
        body: |
          ### المساعد الصوتي العربي (OVOS Voice Assistant v2.3.0 - ONNX Semantic Router Edition)
          تحول معماري ذكي نحو نماذج التضمين الدلالي وموجه المعاني:
          
          - **موجه المعاني الدلالي (ONNX Semantic Router):** استبدال TF-IDF بنموذج Dense Multilingual Embedding (384 أبعاد) لفهم المعنى البشري واللهجات بدقة (مثل فهم "اني زين" و"الحمد لله").
          - **منطق التراجع الصارم (Strict Fallback - Zero Hallucinations):** حظر البحث العشوائي في ويكيبيديا؛ إذا قلت ثقة المطابقة عن 65% يتراجع المساعد فوراً وبأمان.
          - **ذاكرة سياق الحوار (Conversational Chitchat Memory):** استكمال تبادل التحايا والاطمئنان على الحال بمرونة ذكية ودون وسائط خارجية.
          - **الاستدلال السريع وخفة المعالج:** حساب التشابه الزاوي (Cosine Similarity) في أقل من 15 ملي ثانية عبر معالجات أندرويد.
        files: |
          app-debug.apk
          app-debug.apk.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
