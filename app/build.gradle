// إعدادات بناء وحدة التطبيق (Module-level build.gradle) مع دعم Chaquopy
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python' // تفعيل إضافة Chaquopy لتشغيل كود بايثون
}

android {
    namespace 'com.ovos.arabicassistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.ovos.arabicassistant"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // تحديد المعماريات المدعومة لتشغيل بيئة CPython على أجهزة أندرويد
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        // إعدادات بيئة بايثون المدمجة عبر Chaquopy
        python {
            version "3.8"
            pip {
                // محركنا الخفيف يعمل بدون مكتبات ثقيلة، ويمكن تضمين المكتبات حسب الحاجة
                // install "numpy"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            // توجيه مجلد كود بايثون المدمج
            python.srcDir "src/main/python"
            // تضمين مجلد الأصول (النموذج ومجموعة البيانات)
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    
    // دعم الكوروتينز لعمليات المعالجة في الخلفية
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // محرك Vosk للتعرف الصوتي المستمر دون إنترنت
    implementation 'com.alphacephei:vosk-android:0.3.47'
    // عميل OkHttp لطلبات الشبكة
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
